name: productivity_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  audioplayers: ^6.8.1
  cupertino_icons: ^1.0.9
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  flutter_launcher_icons: ^0.14.4
  flutter_local_notifications: ^22.3.0
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.8
  google_fonts: ^8.2.1
  google_sign_in: ^7.2.0
  heatmap_calendar_plus: ^2.3.0
  intl: ^0.20.2
  lottie: ^3.5.1
  provider: ^6.1.5+1
  supabase_flutter: ^2.17.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/icons/
    - assets/images/logos/
    - assets/animations/
    - assets/sounds/

flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#0F0F0F"
  image: assets/images/icons/light_splash_icon.png
  image_dark: assets/images/icons/dark_splash_icon.png

  fullscreen: true

  android_12:
    icon_background_color: "#ECECEC"
    icon_background_color_dark: "#0F0F0F"
    image: assets/images/icons/light_splash_icon.png
    image_dark: assets/images/icons/dark_splash_icon.png

  web: false